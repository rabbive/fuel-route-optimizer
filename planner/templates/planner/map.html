<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fuel route: {{ trip.start.query }} to {{ trip.finish.query }}</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #summary {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: white; padding: 10px 14px; border-radius: 6px;
      max-width: calc(100% - 80px);
      font: 14px/1.5 sans-serif; box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="summary">
    <strong>{{ trip.start.query }} → {{ trip.finish.query }}</strong><br>
    {{ trip.total_distance_miles }} miles · {{ trip.fuel_stops|length }} fuel stops<br>
    {{ trip.total_gallons }} gallons · <strong>${{ trip.total_fuel_cost|floatformat:2 }}</strong>
  </div>

  {{ trip|json_script:"trip-data" }}
  <script>
    // Read the trip JSON that Django put into the page.
    const trip = JSON.parse(document.getElementById("trip-data").textContent);
    // Escape text before Leaflet inserts it into popup HTML.
    function esc(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[char]);
    }
    const map = L.map("map");
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      // OSM tile policy needs a Referer header; Django's default same-origin policy strips it.
      referrerPolicy: "strict-origin-when-cross-origin",
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    // Draw the route and zoom the map to fit it.
    const route = L.geoJSON(trip.route, { style: { color: "#2563eb", weight: 5 } }).addTo(map);
    // Leave room for the totals box only when the map is wide enough.
    const wide = map.getSize().x > 700;
    map.fitBounds(route.getBounds(), wide
      ? { paddingTopLeft: [30, 30], paddingBottomRight: [300, 30] }
      : { padding: [20, 20] });

    // Start and finish pins.
    L.marker([trip.start.lat, trip.start.lon]).addTo(map).bindPopup("Start: " + esc(trip.start.query));
    L.marker([trip.finish.lat, trip.finish.lon]).addTo(map).bindPopup("Finish: " + esc(trip.finish.query));

    // One orange dot per fuel stop, with the details in its popup.
    trip.fuel_stops.forEach((stop, i) => {
      L.circleMarker([stop.lat, stop.lon], { radius: 8, color: "#ea580c", fillOpacity: 0.9 })
        .addTo(map)
        .bindPopup(
          `<b>Stop ${i + 1}: ${esc(stop.name)}</b><br>${esc(stop.address)}, ${esc(stop.city)}, ${esc(stop.state)}<br>` +
          `Mile ${stop.mile_marker} · $${Number(stop.price_per_gallon).toFixed(3)}/gal<br>${stop.gallons} gal = $${Number(stop.cost).toFixed(2)}`
        );
    });
  </script>
</body>
</html>
